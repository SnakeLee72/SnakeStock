<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>融資維持率計算機 - 靈蛇週報工具箱</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        :root { 
            --bg-dark-ai: #0a0a1a; 
            --bg-card: #101024; 
            --border-color: #2a2a4a; 
            --text-primary: #e6e6fa; 
            --text-secondary: #a0a0c0; 
            --accent-blue: #00d1ff; 
            --color-green: #50fa7b; 
            --color-yellow: #f1fa8c; 
            --color-red: #ff5555;
        }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-dark-ai); 
            color: var(--text-primary); 
            margin: 0; 
            padding: 10px; 
        }
        .container { 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 15px; 
        }
        header { 
            text-align: center; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }
        header h1 { 
            color: var(--accent-blue); 
            font-size: 2.5em; 
            margin: 0; 
        }
        .content-card { 
            background-color: var(--bg-card); 
            border-radius: 8px; 
            padding: 30px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border-color);
        }
        .calculator-form .form-group {
            margin-bottom: 20px;
        }
        .calculator-form label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .calculator-form .calc-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark-ai);
            color: var(--text-primary);
            font-size: 1.1em;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .calculator-form .calc-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .radio-group input[type="radio"] {
            opacity: 0;
            position: fixed;
            width: 0;
        }
        .radio-group label {
            display: inline-block;
            background-color: var(--border-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border-color);
        }
        .radio-group input[type="radio"]:checked+label {
            background-color: var(--accent-blue);
            color: var(--bg-dark-ai);
            font-weight: 700;
            border-color: var(--accent-blue);
        }
        .calc-button {
            width: 100%;
            background-color: var(--accent-blue);
            color: #0a0a1a;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .calc-button:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }
        .result-display {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .result-display .label {
            font-size: 1.1em;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .result-display .value {
            font-size: 3.5em;
            font-weight: 700;
            line-height: 1.2;
        }
        .result-display .status {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
        }
        .status-safe { color: var(--color-green); }
        .status-caution { color: var(--color-yellow); }
        .status-danger { color: var(--color-red); }
        #errorMessage {
            color: var(--color-red);
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }
        .explanation {
            font-size: 0.9em;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .site-footer { 
            text-align: center; 
            margin-top: 50px; 
            padding-top: 30px; 
            border-top: 1px solid var(--border-color); 
            color: var(--text-secondary); 
            font-size: 0.9em; 
        }
        .footer-links a { 
            color: var(--text-secondary); 
            text-decoration: none; 
            margin: 0 15px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>融資維持率計算機</h1>
        </header>

        <main>
            <section class="content-card">
                <div class="calculator-form">
                    <div class="form-group">
                        <label for="buyPrice">買入股價 (元)</label>
                        <input type="number" id="buyPrice" class="calc-input" placeholder="您當初買進的價格">
                    </div>
                     <div class="form-group">
                        <label for="currentPrice">當前股價 (元)</label>
                        <input type="number" id="currentPrice" class="calc-input" placeholder="現在的最新價格">
                    </div>
                    <div class="form-group">
                        <label for="shares">融資股數 (股)</label>
                        <input type="number" id="shares" class="calc-input" placeholder="例如：1000 (等於 1 張)">
                    </div>
                    <div class="form-group">
                        <label>市場別</label>
                        <div class="radio-group">
                            <input type="radio" id="marketListed" name="marketType" value="0.6" checked>
                            <label for="marketListed">上市 (融資6成)</label>
                            
                            <input type="radio" id="marketOtc" name="marketType" value="0.5">
                            <label for="marketOtc">上櫃 (融資5成)</label>
                        </div>
                    </div>
                    <button id="calculateBtn" class="calc-button">計算維持率</button>
                    <div id="errorMessage"></div>
                </div>

                <div id="result" class="result-display" style="display: none;">
                    <div class="label">目前融資維持率</div>
                    <div id="resultValue" class="value"></div>
                    <div id="resultStatus" class="status"></div>
                </div>
            </section>

            <section class="content-card explanation">
                <h2>計算說明</h2>
                <p><strong>簡易計算公式：</strong> ( 當前股價 / 買入股價 ) / 融資成數 * 100% </p>
                <p><strong>風險燈號：</strong></p>
                <ul>
                    <li style="color: var(--color-green);"><strong>160% (含) 以上 (安全)：</strong>距離追繳線尚有安全距離。</li>
                    <li style="color: var(--color-yellow);"><strong>130% ~ 160% (警戒)：</strong>已進入警戒區，需密切關注股價變化。</li>
                    <li style="color: var(--color-red);"><strong>130% 以下 (危險)：</strong>已觸及追繳門檻，券商將會發出追繳通知 (Margin Call)。</li>
                </ul>
                <p>註：本工具以標準融資成數（上市6成、上櫃5成）自動計算融資金額。此為概算值，實際金額請以您的券商對帳單為準。</p>
            </section>
        </main>
        
        <footer class="site-footer">
            <div class="footer-links"><a href="/SnakeStock/index.html">返回首頁</a><a href="/SnakeStock/about.html">關於我們</a><a href="/SnakeStock/dashboard.html">個股儀表板</a><a href="/SnakeStock/tools/index.html">投資工具箱</a><a href="/SnakeStock/glossary.html">投資術語庫</a><a href="/SnakeStock/disclaimer.html">免責聲明</a></div>
            <p>&copy; 2025 靈蛇研究團隊謹製</p>
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calculateBtn = document.getElementById('calculateBtn');
            const resultDiv = document.getElementById('result');
            const resultValue = document.getElementById('resultValue');
            const resultStatus = document.getElementById('resultStatus');
            const errorMessage = document.getElementById('errorMessage');

            const buyPriceInput = document.getElementById('buyPrice');
            const currentPriceInput = document.getElementById('currentPrice');
            const sharesInput = document.getElementById('shares');

            calculateBtn.addEventListener('click', function() {
                const buyPrice = parseFloat(buyPriceInput.value);
                const currentPrice = parseFloat(currentPriceInput.value);
                const shares = parseInt(sharesInput.value, 10);
                const loanRatio = parseFloat(document.querySelector('input[name="marketType"]:checked').value);

                // --- Input Validation ---
                if (isNaN(buyPrice) || isNaN(currentPrice) || isNaN(shares) || buyPrice <= 0 || currentPrice <= 0 || shares <= 0) {
                    errorMessage.textContent = '請輸入所有有效的正數值。';
                    resultDiv.style.display = 'none';
                    return;
                }
                errorMessage.textContent = '';

                // --- Calculation ---
                const buyValue = buyPrice * shares;
                const loanAmount = buyValue * loanRatio; 
                const marketValue = currentPrice * shares;
                const maintenanceRatio = (marketValue / loanAmount) * 100;

                // --- Display Result ---
                resultValue.textContent = maintenanceRatio.toFixed(2) + '%';
                
                // --- Update Status ---
                resultStatus.classList.remove('status-safe', 'status-caution', 'status-danger');
                if (maintenanceRatio >= 160) {
                    resultStatus.textContent = '🟢 安全';
                    resultStatus.classList.add('status-safe');
                } else if (maintenanceRatio >= 130) {
                    resultStatus.textContent = '🟡 警戒';
                    resultStatus.classList.add('status-caution');
                } else {
                    resultStatus.textContent = '🔴 危險 (追繳)';
                    resultStatus.classList.add('status-danger');
                }
                
                resultDiv.style.display = 'block';
            });
        });
    </script>
</body>
</html>
