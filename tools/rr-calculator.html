<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目標價報酬率計算機 - 靈蛇週報工具箱</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        :root { 
            --bg-dark-ai: #0a0a1a; 
            --bg-card: #101024; 
            --border-color: #2a2a4a; 
            --text-primary: #e6e6fa; 
            --text-secondary: #a0a0c0; 
            --accent-blue: #00d1ff; 
            --color-green: #50fa7b; 
            --color-yellow: #f1fa8c; 
            --color-orange: #ffb86c;
            --color-red: #ff5555;
        }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-dark-ai); 
            color: var(--text-primary); 
            margin: 0; 
            padding: 10px; 
        }
        .container { 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 15px; 
        }
        header { 
            text-align: center; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }
        header h1 { 
            color: var(--accent-blue); 
            font-size: 2.5em; 
            margin: 0; 
        }
        .content-card { 
            background-color: var(--bg-card); 
            border-radius: 8px; 
            padding: 30px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border-color);
        }
        .calculator-form .form-group {
            margin-bottom: 20px;
        }
        .calculator-form label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .calculator-form .calc-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark-ai);
            color: var(--text-primary);
            font-size: 1.1em;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .calculator-form .calc-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .calc-button {
            width: 100%;
            background-color: var(--accent-blue);
            color: #0a0a1a;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .calc-button:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }
        .result-display {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .result-item .label {
            font-size: 1em;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .result-item .value {
            font-size: 2em;
            font-weight: 700;
        }
        .profit { color: var(--color-red); }
        .loss { color: var(--color-green); }
        
        .rr-ratio-display {
            padding: 20px;
            border-radius: 8px;
            background-color: var(--bg-dark-ai);
        }
        .rr-ratio-display .label {
            font-size: 1.2em;
            color: var(--text-secondary);
        }
        .rr-ratio-display .value {
            font-size: 3em;
            font-weight: 700;
            color: var(--accent-blue);
            margin: 5px 0;
        }
        .rr-ratio-display .comment {
            font-size: 1.2em;
            font-weight: bold;
        }
        .comment-excellent { color: var(--color-green); }
        .comment-good { color: var(--color-yellow); }
        .comment-ok { color: var(--color-orange); }
        .comment-poor { color: var(--color-red); }

        #errorMessage {
            color: var(--color-red);
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }
        .explanation {
            font-size: 0.9em;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .site-footer { 
            text-align: center; 
            margin-top: 50px; 
            padding-top: 30px; 
            border-top: 1px solid var(--border-color); 
            color: var(--text-secondary); 
            font-size: 0.9em; 
        }
        .footer-links a { 
            color: var(--text-secondary); 
            text-decoration: none; 
            margin: 0 15px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>目標價報酬率計算機</h1>
        </header>

        <main>
            <section class="content-card">
                <div class="calculator-form">
                    <div class="form-group">
                        <label for="currentPrice">當前股價 (元)</label>
                        <input type="number" id="currentPrice" class="calc-input" placeholder="例如：100">
                    </div>
                     <div class="form-group">
                        <label for="targetPrice">目標價 (元)</label>
                        <input type="number" id="targetPrice" class="calc-input" placeholder="預期上漲的目標價格">
                    </div>
                    <div class="form-group">
                        <label for="stopLossPrice">停損價 (元)</label>
                        <input type="number" id="stopLossPrice" class="calc-input" placeholder="願意承受虧損的出場價格">
                    </div>
                    <button id="calculateBtn" class="calc-button">評估風險報酬</button>
                    <div id="errorMessage"></div>
                </div>

                <div id="result" class="result-display" style="display: none;">
                    <div class="result-grid">
                        <div class="result-item">
                            <div class="label">潛在報酬率</div>
                            <div class="value profit" id="profitPercent"></div>
                        </div>
                        <div class="result-item">
                            <div class="label">潛在虧損率</div>
                            <div class="value loss" id="lossPercent"></div>
                        </div>
                    </div>
                    <div class="rr-ratio-display">
                        <div class="label">賺賠比</div>
                        <div class="value" id="riskRewardRatio"></div>
                        <div class="comment" id="strategyComment"></div>
                    </div>
                </div>
            </section>

            <section class="content-card explanation">
                <h2>計算說明</h2>
                <p><strong>賺賠比 (Risk/Reward Ratio)：</strong>此為衡量一筆交易是否值得的關鍵指標。它代表您願意用1元的潛在虧損，去交換多少元的潛在利潤。</p>
                <p>一般來說，成熟的交易者會尋找**賺賠比至少在 2:1 以上**的機會，代表潛在獲利是潛在虧損的兩倍或更多，這在數學期望值上是更有利的策略。</p>
            </section>
        </main>
        
        <footer class="site-footer">
             <div class="footer-links">
                <a href="/SnakeStock/index.html">返回首頁</a>
             </div>
            <p>&copy; 2025 靈蛇研究團隊謹製</p>
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calculateBtn = document.getElementById('calculateBtn');
            const resultDiv = document.getElementById('result');
            const errorMessage = document.getElementById('errorMessage');

            const currentPriceInput = document.getElementById('currentPrice');
            const targetPriceInput = document.getElementById('targetPrice');
            const stopLossPriceInput = document.getElementById('stopLossPrice');

            const profitPercentEl = document.getElementById('profitPercent');
            const lossPercentEl = document.getElementById('lossPercent');
            const riskRewardRatioEl = document.getElementById('riskRewardRatio');
            const strategyCommentEl = document.getElementById('strategyComment');

            calculateBtn.addEventListener('click', function() {
                const currentPrice = parseFloat(currentPriceInput.value);
                const targetPrice = parseFloat(targetPriceInput.value);
                const stopLossPrice = parseFloat(stopLossPriceInput.value);

                // --- Input Validation ---
                if (isNaN(currentPrice) || isNaN(targetPrice) || isNaN(stopLossPrice) || currentPrice <= 0 || targetPrice <= 0 || stopLossPrice <= 0) {
                    errorMessage.textContent = '請輸入所有有效的正數值。';
                    resultDiv.style.display = 'none';
                    return;
                }
                if (targetPrice <= currentPrice) {
                    errorMessage.textContent = '錯誤：目標價必須高於當前股價。';
                    resultDiv.style.display = 'none';
                    return;
                }
                if (stopLossPrice >= currentPrice) {
                    errorMessage.textContent = '錯誤：停損價必須低於當前股價。';
                    resultDiv.style.display = 'none';
                    return;
                }
                errorMessage.textContent = '';

                // --- Calculation ---
                const potentialProfit = targetPrice - currentPrice;
                const potentialLoss = currentPrice - stopLossPrice;

                const profitPercentage = (potentialProfit / currentPrice) * 100;
                const lossPercentage = (potentialLoss / currentPrice) * 100;
                
                let riskRewardRatio = 0;
                if (potentialLoss > 0) {
                    riskRewardRatio = potentialProfit / potentialLoss;
                }

                // --- Display Result ---
                profitPercentEl.textContent = `+${profitPercentage.toFixed(2)}%`;
                lossPercentEl.textContent = `-${lossPercentage.toFixed(2)}%`;
                riskRewardRatioEl.textContent = `${riskRewardRatio.toFixed(1)} : 1`;

                // --- Update Strategy Comment ---
                strategyCommentEl.classList.remove('comment-excellent', 'comment-good', 'comment-ok', 'comment-poor');
                if (riskRewardRatio >= 3) {
                    strategyCommentEl.textContent = '🟢 風險報酬比極佳';
                    strategyCommentEl.classList.add('comment-excellent');
                } else if (riskRewardRatio >= 2) {
                    strategyCommentEl.textContent = '🟡 風險報酬比良好';
                    strategyCommentEl.classList.add('comment-good');
                } else if (riskRewardRatio >= 1) {
                    strategyCommentEl.textContent = '🟠 風險報酬比尚可';
                    strategyCommentEl.classList.add('comment-ok');
                } else {
                    strategyCommentEl.textContent = '🔴 風險報酬比不佳';
                    strategyCommentEl.classList.add('comment-poor');
                }
                
                resultDiv.style.display = 'block';
            });
        });
    </script>
</body>
</html>
